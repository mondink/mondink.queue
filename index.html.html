<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Pickle Queue</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1a1d21;--mu:#6b7280;--ac:#1f8a5b;--bd:#e3e6ea;--w:#c2410c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1e2226;--tx:#eceff2;--mu:#9aa3ad;--ac:#3fbf8a;--bd:#2c3238;--w:#fb923c}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1e2226;--tx:#eceff2;--mu:#9aa3ad;--ac:#3fbf8a;--bd:#2c3238;--w:#fb923c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:4px 0 10px}h2{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 10px}
input{flex:1;min-width:140px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.team{flex:1;min-width:120px}.team b{display:block;font-size:12px;color:var(--mu)}
.vs{color:var(--mu);font-size:12px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);margin-left:4px;cursor:pointer}
.nx{border-left:3px solid var(--ac);padding-left:8px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-size:12px}
.note{font-size:12px;color:var(--mu)}
</style></head><body><main>
<h1>🏓 Pickle Queue</h1>
<div class="card">
<div class="row"><input id="names" placeholder="Names, separated by commas"><select id="lvl"><option value="1">Novice</option><option value="2" selected>Intermediate</option><option value="3">Advanced</option></select><button class="p" onclick="add()">Add</button></div>
<p class="note">Tap a level tag to change it. Winners get 3 points, +1 per level the opponents are above them (or −1 per level below), min 2, max 5. Losers get 1.</p>
</div>
<h2>Courts</h2><div id="courts"></div>
<h2>Queue</h2><div class="card" id="queue"></div>
<h2>Leaderboard</h2><div class="card scroll" id="board"></div>
<div class="row"><button onclick="undo()">Undo last game</button><button onclick="resetAll()">Reset all</button></div>
</main>
<script>
var L={1:"Novice",2:"Inter",3:"Adv"},S={players:[],queue:[],courts:[null,null],next:1},H=[];
try{var sv=localStorage.getItem("pq");if(sv)S=JSON.parse(sv)}catch(e){}
function save(){try{localStorage.setItem("pq",JSON.stringify(S))}catch(e){}}
function P(id){return S.players.find(function(p){return p.id==id})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function add(){var v=document.getElementById("names").value,l=+document.getElementById("lvl").value;
v.split(",").map(function(s){return s.trim()}).filter(Boolean).forEach(function(n){var id=S.next++;S.players.push({id:id,name:n,lvl:l,pts:0,gp:0,w:0});S.queue.push(id)});
document.getElementById("names").value="";fill();commit()}
function cyc(id){var p=P(id);p.lvl=p.lvl%3+1;commit()}
function drop(id){S.queue=S.queue.filter(function(q){return q!=id});S.players=S.players.filter(function(p){return p.id!=id});commit()}
function fill(){S.courts.forEach(function(c,i){if(!c&&S.queue.length>=4){var g=S.queue.splice(0,4).sort(function(a,b){return P(b).lvl-P(a).lvl});S.courts[i]={a:[g[0],g[3]],b:[g[1],g[2]],t:Date.now()}}})}
function avg(ids){return ids.reduce(function(s,i){return s+P(i).lvl},0)/ids.length}
function win(ci,t){H.push(JSON.stringify(S));var c=S.courts[ci],W=c[t],Lo=c[t=="a"?"b":"a"];
var pts=Math.max(2,Math.min(5,3+Math.round(avg(Lo)-avg(W))));
W.forEach(function(i){var p=P(i);p.pts+=pts;p.gp++;p.w++});Lo.forEach(function(i){var p=P(i);p.pts+=1;p.gp++});
S.queue.push.apply(S.queue,W.concat(Lo));S.courts[ci]=null;fill();commit()}
function undo(){if(H.length){S=JSON.parse(H.pop());commit(1)}}
function resetAll(){if(confirm("Clear all players and points?")){S={players:[],queue:[],courts:[null,null],next:1};H=[];commit(1)}}
function commit(){save();render()}
function nm(i){var p=P(i);return esc(p.name)+'<span class="tag" onclick="cyc('+i+')">'+L[p.lvl]+'</span>'}
function render(){
document.getElementById("courts").innerHTML=S.courts.map(function(c,i){
if(!c)return'<div class="card"><b>Court '+(i+1)+'</b><div class="note">Waiting for 4 players in the queue</div></div>';
return'<div class="card"><b>Court '+(i+1)+'</b> <span class="tag tmr" style="cursor:default" data-t="'+(c.t||Date.now())+'">0:00</span><div class="row" style="margin:8px 0"><div class="team"><b>Team A</b>'+c.a.map(nm).join("<br>")+'</div><span class="vs">vs</span><div class="team"><b>Team B</b>'+c.b.map(nm).join("<br>")+'</div></div><div class="row"><button class="p" onclick="win('+i+',\'a\')">Team A won</button><button class="p" onclick="win('+i+',\'b\')">Team B won</button></div></div>'}).join("");
document.getElementById("queue").innerHTML=S.queue.length?S.queue.map(function(id,k){return'<div class="'+(k<4?"nx":"")+'" style="padding:3px 0">'+(k+1)+'. '+nm(id)+' <span class="tag" onclick="drop('+id+')">remove</span></div>'}).join(""):'<span class="note">Queue is empty</span>';
var r=S.players.slice().sort(function(a,b){return b.pts-a.pts||b.w-a.w});
document.getElementById("board").innerHTML=r.length?'<table><tr><th>#</th><th>Player</th><th>Pts</th><th>Games</th><th>Wins</th><th>Win%</th></tr>'+r.map(function(p,k){return'<tr><td>'+(k+1)+'</td><td>'+esc(p.name)+'<span class="tag">'+L[p.lvl]+'</span></td><td><b>'+p.pts+'</b></td><td>'+p.gp+'</td><td>'+p.w+'</td><td>'+(p.gp?Math.round(p.w/p.gp*100)+'%':'-')+'</td></tr>'}).join("")+'</table>':'<span class="note">No players yet</span>'}
document.getElementById("names").addEventListener("keydown",function(e){if(e.key=="Enter")add()});
function tick(){document.querySelectorAll('.tmr').forEach(function(e){var d=Math.max(0,Math.floor((Date.now()-e.dataset.t)/1000)),m=Math.floor(d/60),x=d%60;e.textContent=m+':'+(x<10?'0':'')+x})}
setInterval(tick,1000);
var _r=render;render=function(){_r();tick()};
render();
</script></body></html>
